<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
</head>
<body>

    <h1>Calculadora de IMC</h1>

    <form id="formularioIMC">

        <label for="peso">Peso (kg):</label>
        <input type="number" id="peso" step="0.1">

        <br><br>

        <label for="altura">Altura (m):</label>
        <input type="number" id="altura" step="0.01">

        <br><br>

        <button type="submit">Calcular IMC</button>

    </form>

    <div id="resultado"></div>

</body>
</html>

<script>

    function calcularIMC(peso, altura) {

        let imc = peso / (altura * altura);
        let classificacao;

        if (imc < 18.5) {
            classificacao = "Abaixo do peso";

        } else if (imc >= 18.5 && imc < 24.9) {
            classificacao = "Normal";

        } else if (imc >= 25 && imc < 29.9) {
            classificacao = "Sobrepeso";

        } else {
            classificacao = "Obesidade";
        }

        return {
            imc: imc.toFixed(2),
            classificacao: classificacao
        };
    }


    const formulario = document.getElementById("formularioIMC");

    formulario.addEventListener("submit", function(event) {

        event.preventDefault();

        const peso = Number(document.getElementById("peso").value);
        const altura = Number(document.getElementById("altura").value);

        const resultado = calcularIMC(peso, altura);

        document.getElementById("resultado").innerHTML = `
            <h2>Resultado</h2>
            <p>IMC: ${resultado.imc}</p>
            <p>Classificação: ${resultado.classificacao}</p>
        `;

    });

</script>
